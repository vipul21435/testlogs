[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testlogs"
version = "0.1.0"
description = "Turn any test runner's output into per-test results, and diff two runs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vipul Raj Jha" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
testlogs = "testlogs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testlogs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
